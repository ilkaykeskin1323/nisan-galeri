<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nişan Galerisi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
        }

        .hero {
            width: 100%;
            height: 60vh;
            object-fit: cover;
            object-position: top;
            display: block;
        }

        .form-card {
            background: white;
            border-radius: 24px 24px 0 0;
            margin-top: -24px;
            padding: 2rem 1.5rem 2.5rem;
            text-align: center;
            position: relative;
        }

        .form-card h2 {
            font-size: 1.6rem;
            margin-bottom: 0.4rem;
        }

        .form-card p {
            color: #666;
            margin-bottom: 1.2rem;
        }

        input,
        button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 12px;
            border: 1px solid #d2d2d7;
            font-size: 1rem;
        }

        button {
            background: #000000;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }

        #status {
            margin-top: 0.8rem;
            color: #444;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>
    <img class="hero" src="nisanfoto.jpeg" alt="Güliz & İlkay">
    <div class="form-card">
        <h2>Güliz & İlkay</h2>
        <p>Anılarınızı bizimle paylaşın</p>
        <input type="text" id="name" placeholder="Adınız Soyadınız">
        <input type="file" id="files" multiple accept="image/*,video/*">
        <button onclick="upload()">Yükle</button>
        <p id="status"></p>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyyq1ceP9APXAqhXaMhX-SyGynUBRwBDsqxGSOwvr0IoPZDQ3uvxlj1jOFx1uIhBCio/exec";

        async function upload() {
            const name = document.getElementById('name').value;
            const files = document.getElementById('files').files;
            const status = document.getElementById('status');
            if (!name || files.length === 0) return alert("Eksik bilgi!");

            status.innerText = "Yükleniyor...";
            const filePromises = Array.from(files).map(file => {
                return new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = e => resolve({ name: file.name, content: e.target.result });
                    reader.readAsDataURL(file);
                });
            });

            const fileData = await Promise.all(filePromises);
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ guestName: name, files: fileData })
            }).then(() => {
                status.innerText = "Tamamlandı! Teşekkürler.";
            });
        }
    </script>
</body>

</html>

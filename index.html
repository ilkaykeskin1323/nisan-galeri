<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nişan Galerisi</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #d2d2d7;
        }

        button {
            background: #0071e3;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Derya & Ali</h2>
        <p>Anılarınızı bizimle paylaşın</p>
        <input type="text" id="name" placeholder="Adınız Soyadınız">
        <input type="file" id="files" multiple accept="image/*,video/*">
        <button onclick="upload()">Yükle</button>
        <p id="status"></p>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyyq1ceP9APXAqhXaMhX-SyGynUBRwBDsqxGSOwvr0IoPZDQ3uvxlj1jOFx1uIhBCio/exec";

        async function upload() {
            const name = document.getElementById('name').value;
            const files = document.getElementById('files').files;
            const status = document.getElementById('status');
            if (!name || files.length === 0) return alert("Eksik bilgi!");

            status.innerText = "Yükleniyor...";
            const filePromises = Array.from(files).map(file => {
                return new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = e => resolve({ name: file.name, content: e.target.result });
                    reader.readAsDataURL(file);
                });
            });

            const fileData = await Promise.all(filePromises);
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ guestName: name, files: fileData })
            }).then(() => {
                status.innerText = "Tamamlandı! Teşekkürler.";
            });
        }
    </script>
</body>

</html>

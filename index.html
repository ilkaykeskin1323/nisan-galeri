<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güliz & İlkay Nişan Galerisi</title>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
        }

        .hero {
            width: 100%;
            height: 60vh;
            object-fit: cover;
            object-position: top;
            display: block;
        }

        .form-card {
            background: white;
            border-radius: 24px 24px 0 0;
            margin-top: -24px;
            padding: 2rem 1.5rem 3rem;
            text-align: center;
            position: relative;
        }

        h2 {
            font-size: 1.7rem;
            color: #1d1d1f;
            margin-bottom: 0.4rem;
        }

        .subtitle {
            color: #86868b;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 1rem;
            border-radius: 12px;
            border: 1px solid #d2d2d7;
            font-size: 16px;
        }

        .upload-btn {
            background: #000000;
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        .progress-container {
            display: none;
            margin-top: 1.5rem;
        }

        .progress-track {
            background: #e5e5e7;
            border-radius: 99px;
            height: 6px;
            width: 100%;
            overflow: hidden;
        }

        .progress-fill {
            background: #000000;
            height: 100%;
            width: 0%;
            border-radius: 99px;
            transition: width 0.2s ease;
        }

        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #86868b;
        }

        .upload-warning {
            display: none;
            margin-top: 1rem;
            background: linear-gradient(135deg, #ff4e00, #e63946);
            color: white;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 600;
            text-align: left;
            gap: 10px;
            align-items: flex-start;
        }

        .upload-warning.visible {
            display: flex;
            animation: pulse-border 2s ease-in-out infinite;
        }

        .upload-warning .warn-icon {
            font-size: 20px;
            flex-shrink: 0;
            line-height: 1.2;
        }

        .upload-warning .warn-text {
            line-height: 1.5;
        }

        .upload-warning .warn-text small {
            display: block;
            font-weight: 400;
            opacity: 0.85;
            margin-top: 2px;
            font-size: 12px;
        }

        @keyframes pulse-border {
            0%, 100% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.5); }
            50% { box-shadow: 0 0 0 6px rgba(230, 57, 70, 0); }
        }

        .upload-btn:disabled {
            background: #86868b;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <img class="hero" src="nisanfoto.jpeg" alt="Güliz & İlkay">

    <div class="form-card">
        <h2>Güliz & İlkay</h2>
        <p class="subtitle">Bu güzel günden kareleri bizimle paylaşın.</p>

        <input type="text" id="guestName" placeholder="Adınız Soyadınız">
        <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none">
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Fotoğraf / Video Seç</button>

        <div class="progress-container" id="progressContainer">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p id="status">Hazırlanıyor...</p>
        </div>

        <div class="upload-warning" id="uploadWarning">
            <span class="warn-icon">⚠️</span>
            <div class="warn-text">
                Yükleme devam ediyor — lütfen sayfayı kapatmayın!
                <small>Sayfayı kapatırsanız yükleme yarıda kesilir ve fotoğraflar kaybolabilir.</small>
            </div>
        </div>
    </div>

    <script>
        const CLOUD_NAME = "dxu72h68n";
        const UPLOAD_PRESET = "nisan_galeri";

        let isUploading = false;

        window.addEventListener('beforeunload', (e) => {
            if (!isUploading) return;
            e.preventDefault();
            e.returnValue = '';
        });

        document.getElementById('fileInput').onchange = async function () {
            const name = document.getElementById('guestName').value.trim();
            if (!name) { alert("Lütfen önce adınızı yazın."); this.value = ""; return; }

            const files = this.files;
            const container = document.getElementById('progressContainer');
            const fill = document.getElementById('progressFill');
            const status = document.getElementById('status');
            const warning = document.getElementById('uploadWarning');
            const btn = document.querySelector('.upload-btn');
            const nameInput = document.getElementById('guestName');

            container.style.display = 'block';
            warning.classList.add('visible');
            isUploading = true;
            btn.disabled = true;
            btn.innerText = 'Yükleniyor...';
            nameInput.disabled = true;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                status.innerText = `Yükleniyor: ${i + 1} / ${files.length}`;

                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', UPLOAD_PRESET);
                formData.append('folder', `Nisan_Galeri/${name}`);
                formData.append('context', `uploader=${name}`);

                try {
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, true);

                    xhr.upload.onprogress = (e) => {
                        const fileProgress = Math.round((e.loaded / e.total) * 100);
                        const overall = Math.round(((i + fileProgress / 100) / files.length) * 100);
                        fill.style.width = overall + '%';
                    };

                    await new Promise((resolve, reject) => {
                        xhr.onload = () => xhr.status === 200 ? resolve(JSON.parse(xhr.responseText)) : reject();
                        xhr.onerror = () => reject();
                        xhr.send(formData);
                    });
                } catch (err) {
                    console.error("Yükleme hatası:", err);
                }
            }

            isUploading = false;
            warning.classList.remove('visible');
            btn.disabled = false;
            btn.innerText = 'Fotoğraf / Video Seç';
            nameInput.disabled = false;
            fill.style.width = '100%';
            status.innerText = "Tüm dosyalar başarıyla yüklendi! Teşekkürler ✨";
            this.value = "";
        };
    </script>
</body>

</html>

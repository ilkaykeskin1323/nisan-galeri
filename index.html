<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derya & Ali Nişan Galerisi</title>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        :root {
            --apple-blue: #0071e3;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-bottom: 0.5rem;
            color: #1d1d1f;
        }

        p {
            color: #86868b;
            margin-bottom: 2rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border-radius: 12px;
            border: 1px solid #d2d2d7;
            box-sizing: border-box;
            font-size: 16px;
        }

        .upload-btn {
            background: var(--apple-blue);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: all 0.3s;
        }

        .progress-container {
            display: none;
            margin-top: 20px;
        }

        .progress-bar {
            background: #e5e5e7;
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
        }

        .progress-fill {
            background: var(--apple-blue);
            height: 100%;
            width: 0%;
            transition: width 0.2s;
        }

        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #1d1d1f;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Derya & Ali</h2>
        <p>Bu güzel günden kareleri bizimle paylaşın.</p>

        <input type="text" id="guestName" placeholder="Adınız Soyadınız">
        <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none">
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Fotoğraf / Video Seç</button>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p id="status">Hazırlanıyor...</p>
        </div>
    </div>

    <script>
        const CLOUD_NAME = "dxu72h68n";
        const UPLOAD_PRESET = "nisan_galeri"; // Preset ismini buraya yaz

        document.getElementById('fileInput').onchange = async function () {
            const name = document.getElementById('guestName').value.trim();
            if (!name) { alert("Lütfen önce adınızı yazın."); this.value = ""; return; }

            const files = this.files;
            const container = document.getElementById('progressContainer');
            const fill = document.getElementById('progressFill');
            const status = document.getElementById('status');

            container.style.display = 'block';

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                status.innerText = `Yükleniyor: ${i + 1} / ${files.length}`;

                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', UPLOAD_PRESET);
                formData.append('folder', `Nisan_Galeri/${name}`); // İsimli klasör yapısı
                formData.append('context', `uploader=${name}`);

                try {
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, true);

                    xhr.upload.onprogress = (e) => {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        fill.style.width = percent + '%';
                    };

                    const response = await new Promise((resolve, reject) => {
                        xhr.onload = () => xhr.status === 200 ? resolve(JSON.parse(xhr.responseText)) : reject();
                        xhr.onerror = () => reject();
                        xhr.send(formData);
                    });
                } catch (err) {
                    console.error("Yükleme hatası:", err);
                }
            }

            status.innerText = "Tüm dosyalar başarıyla yüklendi! Teşekkürler ✨";
            fill.style.width = '100%';
            this.value = "";
        };
    </script>

</body>

</html>
